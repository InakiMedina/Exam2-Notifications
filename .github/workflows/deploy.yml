name: Deploy Notification Lambda (Docker)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

env:
  ECR_REPOSITORY: notification-service 

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and Push
        run: |
          docker build -t ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest .
          docker push ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.0"
          terraform_wrapper: false

      - name: Terraform Init
        working-directory: ./terraform
        run: terraform init

      - name: Terraform Plan (guard wrong state)
        working-directory: ./terraform
        run: |
          terraform plan -no-color -out=tfplan 2>&1 | tee plan.txt
          if grep -E 'aws_(instance|security_group)\.(sales|catalog)' plan.txt; then
            echo "::error::State file looks like Catalog/Sales, not Notifications. See terraform/STATE-FIX.md"
            exit 1
          fi

      - name: Terraform Apply
        working-directory: ./terraform
        run: terraform apply -auto-approve tfplan
        env:
          TF_VAR_notification_email: inaki.medina@gmail.com
          TF_VAR_enable_sqs_trigger: "true"
          
      - name: Update Lambda Image
        run: |
          FUNCTION_NAME="SalesNotificationHandler"
          if aws lambda get-function --function-name "$FUNCTION_NAME" >/dev/null 2>&1; then
            aws lambda update-function-code \
              --function-name "$FUNCTION_NAME" \
              --image-uri ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest
          else
            echo "Lambda function $FUNCTION_NAME not found; there was a Terraform provisioning error."
            exit 1
          fi

      - name: Job summary
        working-directory: ./terraform
        run: |
          URL=$(terraform output -raw lambda_function_url 2>/dev/null || echo "")
          {
            echo "## Notification Lambda"
            echo ""
            echo "**Test email:** confirm SNS subscription in inbox, then:"
            echo '```powershell'
            echo '$env:NOTIFICATION_LAMBDA_URL="'$URL'"'
            echo '.\send_email_test.ps1'
            echo '```'
            echo ""
            echo "Or POST JSON: \`{\"test\": true}\` to the function URL."
          } >> "$GITHUB_STEP_SUMMARY"